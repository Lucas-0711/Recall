<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><meta name="apple-mobile-web-app-title" content="Recall"><script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.type==="update"&&window.onAppUpdate)window.onAppUpdate();});}</script><title>Recall — Flashcards</title><style>
:root{
  --bg:#f2f2f7;--bg2:#fff;--elev:#fff;--text:#0b0b0f;--sub:#6e6e73;--ter:#aeaeb2;--sep:rgba(60,60,67,.14);
  --fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.08);
  --accent:#5e5ce6;--accent-2:#bf5af2;--accent-soft:rgba(94,92,230,.12);
  --new:#0a84ff;--learn:#ff6b3d;--rev:#30b158;
  --again:#ff453a;--hard:#ff9f0a;--good:#30c15a;--easy:#0a84ff;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.07);
  --r:16px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--bg2:#1c1c1e;--elev:#1c1c1e;--text:#f5f5f7;--sub:#98989f;--ter:#636366;--sep:rgba(84,84,88,.45);
  --fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.14);--accent:#7d7aff;--accent-soft:rgba(125,122,255,.18);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
#app{height:100%;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 8px) 16px calc(96px + var(--sab))}
.topbar{display:flex;justify-content:flex-end;gap:6px;min-height:40px;align-items:center}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--fill2)}
.iconbtn svg{width:20px;height:20px}
.iconbtn:active{opacity:.6}
h1.large{font-size:34px;font-weight:800;letter-spacing:-.6px;margin:2px 4px 14px}
.subhead{font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:.3px;margin:22px 16px 7px;font-weight:600}
.group{background:var(--bg2);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:52px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row:active{background:var(--fill2)}
.row .grow{flex:1;min-width:0}
.row .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--ter);font-size:20px}
.row .val{color:var(--sub)}
.row.danger{color:var(--again)}
.row.accent{color:var(--accent)}
.counts{display:flex;gap:5px;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.pill{min-width:28px;padding:3px 8px;border-radius:99px;text-align:center}
.pill.n{color:var(--new);background:color-mix(in srgb,var(--new) 13%,transparent)}
.pill.l{color:var(--learn);background:color-mix(in srgb,var(--learn) 13%,transparent)}
.pill.r{color:var(--rev);background:color-mix(in srgb,var(--rev) 14%,transparent)}
.pill.z{color:var(--ter);background:transparent}
.twisty{width:22px;color:var(--ter);font-size:12px;text-align:center;flex:none}
.deckicon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none}
.hero{border-radius:22px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:var(--shadow);margin-bottom:6px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1}
.hero .lbl{opacity:.85;font-size:14px;margin-top:4px}
.hero .sub{display:flex;gap:16px;margin-top:14px;font-size:14px;opacity:.95}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;font-weight:600;width:100%;background:var(--accent);color:#fff;font-size:17px}
.btn:active{transform:scale(.98);opacity:.9}
.btn.sec{background:var(--fill);color:var(--accent)}
.btn.white{background:#fff;color:var(--accent)}
.btn[disabled]{opacity:.4}
.empty{text-align:center;padding:50px 20px;color:var(--sub)}
.empty .em{font-size:52px;margin-bottom:8px}
.empty h3{color:var(--text);margin:6px 0;font-size:22px}
.stack{display:flex;flex-direction:column;gap:10px}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;padding:6px 8px calc(6px + var(--sab));background:color-mix(in srgb,var(--bg2) 78%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--ter);padding:4px 0}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--accent)}
/* screens */
.screen{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;animation:push .28s cubic-bezier(.2,.8,.2,1)}
@keyframes push{from{transform:translateX(30%);opacity:.0}to{transform:none;opacity:1}}
.navbar{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 6px) 10px 6px;min-height:52px}
.navbar .back{color:var(--accent);display:flex;align-items:center;gap:2px;font-size:17px;padding:6px}
.navbar .ttl{flex:1;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;animation:fade .2s;display:flex;align-items:flex-end;justify-content:center}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.9,.2,1);padding-bottom:var(--sab)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .sh-head{display:flex;align-items:center;padding:14px 16px 8px;gap:8px}
.sheet .sh-head .t{flex:1;text-align:center;font-weight:600}
.sheet .sh-head button{color:var(--accent);min-width:64px}
.sheet .sh-head button.r{text-align:right;font-weight:600}
.sheet .sh-body{overflow-y:auto;padding:4px 16px 24px}
.field{background:var(--bg2);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.field textarea,.field input,.field select{width:100%;border:0;outline:0;background:transparent;resize:none;font-size:17px;padding:2px 0}
.field textarea{min-height:64px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:12px}
.seg button{flex:1;padding:7px 4px;border-radius:7px;font-size:14px;font-weight:500}
.seg button.on{background:var(--elev);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:11px;padding:8px 12px;margin-bottom:12px}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:17px}
.toolbar{display:flex;gap:6px;margin:-4px 0 8px}
.chip{padding:6px 12px;border-radius:99px;background:var(--fill);font-size:14px;font-weight:500}
.chip.on{background:var(--accent);color:#fff}
/* study */
.study{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;animation:fade .2s}
.study .bar{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 6px) 12px 8px}
.study .bar .counts{flex:1;justify-content:center}
.study .bar .counts span{padding:2px 6px}
.study .bar .counts .cur{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.progress{height:3px;background:var(--fill);margin:0 16px;border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
.cardwrap{flex:1;overflow-y:auto;padding:14px 16px;display:flex}
.cardface{flex:1;background:var(--bg2);border-radius:24px;box-shadow:var(--shadow);min-height:100%;overflow:hidden;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.97);opacity:.4}}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 16px calc(12px + var(--sab))}
.answers.one{grid-template-columns:1fr}
.ans{height:62px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:16px;color:#fff}
.ans small{font-weight:500;font-size:12px;opacity:.85;margin-top:1px}
.ans:active{transform:scale(.96)}
.ans.a1{background:var(--again)}.ans.a2{background:var(--hard)}.ans.a3{background:var(--good)}.ans.a4{background:var(--easy)}
.ans.show{background:var(--fill);color:var(--text);height:58px}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.done .em{font-size:64px}
/* stats */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg2);border-radius:var(--r);padding:14px}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .k{font-size:13px;color:var(--sub)}
.chart{background:var(--bg2);border-radius:var(--r);padding:14px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px}
.bars div{flex:1;background:var(--accent);border-radius:4px 4px 1px 1px;min-height:2px;position:relative}
.bars div.zero{background:var(--fill)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:6px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--fill)}
.stackbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--fill);margin:8px 0}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--sub)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
/* dialog / toast */
.dialog{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:grid;place-items:center;animation:fade .15s}
.dialog .box{width:280px;background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;overflow:hidden;text-align:center;animation:pop .2s}
.dialog .msg{padding:20px 16px 16px}
.dialog .msg b{display:block;margin-bottom:4px}
.dialog .msg p{margin:0;font-size:13px;color:var(--sub)}
.dialog input{width:100%;margin-top:12px;padding:8px 10px;border-radius:8px;border:.5px solid var(--sep);background:var(--bg);outline:0}
.dialog .btns{display:flex;border-top:.5px solid var(--sep)}
.dialog .btns button{flex:1;padding:12px;color:var(--accent);font-size:17px}
.dialog .btns button+button{border-left:.5px solid var(--sep);font-weight:600}
.dialog .btns button.destr{color:var(--again)}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--sab));transform:translateX(-50%);background:rgba(30,30,32,.92);color:#fff;padding:10px 18px;border-radius:99px;font-size:15px;z-index:70;animation:fade .2s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.busy{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.35);display:grid;place-items:center}
.busy .box{background:var(--bg2);border-radius:16px;padding:22px 26px;text-align:center;min-width:220px}
.spin{width:30px;height:30px;border:3px solid var(--fill);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ter)}
.sync.ok i{background:var(--good)}.sync.err i{background:var(--again)}.sync.busy i{background:var(--hard)}
.note{font-size:13px;color:var(--sub);margin:8px 16px 0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
html{touch-action:manipulation}
.banner{background:color-mix(in srgb,var(--again) 14%,var(--bg2));border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 10px}
.updatebar{position:fixed;left:50%;top:calc(var(--sat) + 8px);transform:translateX(-50%);z-index:75;background:var(--accent);color:#fff;padding:9px 16px;border-radius:99px;font-size:15px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap}
.rich{min-height:48px;outline:0;font-size:17px;padding:2px 0;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.rich:empty::before{content:attr(data-ph);color:var(--ter)}
.rich img{max-width:100%;max-height:180px;border-radius:8px;vertical-align:middle}
.ftools{display:flex;gap:14px}
.ftools button{color:var(--accent);font-weight:700;text-transform:none;font-size:12px;letter-spacing:0}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);overflow:auto;display:flex;animation:fade .15s;cursor:zoom-out}
.lightbox img{margin:auto;max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.lightbox.zoom img{max-width:none;max-height:none;width:250%;cursor:zoom-out}
.cardwrap{touch-action:pan-y;position:relative}
.swipehint{position:absolute;top:30px;left:50%;transform:translateX(-50%);padding:6px 18px;border-radius:99px;color:#fff;font-weight:700;opacity:0;pointer-events:none;z-index:2}
.answers.two{grid-template-columns:1fr 1fr}

    throw new Error('This file needs a newer importer. Re-export from Anki with “Support older Anki versions” checked.');
  }

  const media = [];
  const mf = zip.file('media');
  if (mf) {
    let mb = await mf.async('uint8array');
    let names = [];
    if (isZstd(mb)) {
      mb = await zstdDecompress(mb);

  }
  row.push(f); rows.push(row);

    const cell = i => (i != null && r[i] != null ? r[i] : '');

      el.innerHTML = bar + `<div class="cardwrap" data-a="tapcard"><div class="swipehint"></div><div class="cardface" id="cardhost"></div></div><div class="answers ${!this.back ? 'one' : cram ? 'two' : ''}">${btns}</div>`;
      this.bindSwipe($('.cardwrap', el));
      const back = this.back;
      mountCard($('#cardhost'), c, back, this.typed).then(root => {
        if (this.card !== c || this.back !== back || !root.isConnected) return;
        const inp = root.querySelector('.typeans');
        if (inp) { inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); this.flip(); } e.stopPropagation(); }); inp.addEventListener('click', e => e.stopPropagation()); }
        const a = root.querySelector('#answer');
        if (back) {
          const wrap = $('.cardwrap');
          if (a && wrap && wrap.scrollHeight > wrap.clientHeight) wrap.scrollTo({ top: Math.max(0, a.getBoundingClientRect().top - wrap.getBoundingClientRect().top - 60), behavior: 'smooth' });
        }
        if (S.conf.autoplay) {
          let snd = [...root.querySelectorAll('.snd')];
          if (back && a) snd = snd.filter(x => a.compareDocumentPosition(x) & Node.DOCUMENT_POSITION_FOLLOWING);
          if (snd.length) Player.run(snd);
        }
      });
    }
    el.onclick = e => this.onClick(e);
  },
  /* Touch only: once the answer is showing, drag right = Good, left = Again. */
  bindSwipe(wrap) {
    if (!S.conf.swipe || !wrap) return;
    const face = wrap.querySelector('.cardface'), hint = wrap.querySelector('.swipehint');
    let sx = 0, sy = 0, id = null, drag = false;
    wrap.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') return; sx = e.clientX; sy = e.clientY; id = e.pointerId; drag = false; });
    wrap.addEventListener('pointermove', e => {
      if (e.pointerId !== id || !this.back) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!drag && Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.5) { drag = true; try { wrap.setPointerCapture(id); } catch (err) {} }
      if (!drag) return;
      face.style.transition = 'none'; face.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`;
      hint.textContent = dx > 0 ? (this.mode === 'cram' ? 'Got it' : 'Good') : 'Again';
      hint.style.background = dx > 0 ? 'var(--good)' : 'var(--again)';
      hint.style.opacity = Math.min(1, Math.abs(dx) / 90);
    });
    const end = e => {
      if (e.pointerId !== id) return; id = null;
      if (!drag) return; drag = false;
      const dx = e.clientX - sx;
      if (e.type === 'pointerup' && Math.abs(dx) > 90) return this.answer(dx > 0 ? 3 : 1);
      face.style.transition = 'transform .2s'; face.style.transform = ''; hint.style.opacity = 0;
    };
    wrap.addEventListener('pointerup', end); wrap.addEventListener('pointercancel', end);
  },
  flip() {
    if (!this.card || this.back) return;
    const host = $('#cardhost'); const inp = host && host.shadowRoot && host.shadowRoot.querySelector('.typeans');
    this.typed = inp ? inp.value : '';
    this.back = true; this.paint();
  },
  /* Undo: every action snapshots whatever it is about to touch, so one mechanism
     reverses answers, sibling burying, leech suspension, suspend/bury/reset and deletes. */
  snap() { return { cards: {}, notes: {}, revlog: S.revlog.length, today: JSON.stringify(today()), done: this.done, focus: this.card && this.card.id, pool: this.pool && [...this.pool] }; },
  keep(u, id) { if (!(id in u.cards)) u.cards[id] = S.cards[id] ? { ...S.cards[id] } : null; },
  keepNote(u, nid) {
    if (!(nid in u.notes)) u.notes[nid] = S.notes[nid] ? { ...S.notes[nid] } : null;
    for (const x of Object.values(S.cards)) if (x.nid === nid) this.keep(u, x.id);
  },
  commit(u) { this.undo.push(u); if (this.undo.length > 30) this.undo.shift(); },
  answer(ease) {
    const c = this.card; if (!c || !this.back) return;
    const u = this.snap();
    if (this.mode === 'cram') {
      this.pool = this.pool.filter(id => id !== c.id);
      if (ease === 1) this.pool.splice(Math.min(this.pool.length, 3), 0, c.id); else this.done++;
      this.commit(u);
      return this.next();
    }
    const t = today(), now = Date.now(), wasNew = c.type === 0, wasRev = c.type === 2;
    this.keep(u, c.id);
    let n = schedule(c, ease, now);
    S.revlog.push([now, c.id, ease, n.type === 2 ? n.ivl : -Math.round((n.due - now) / 1000), c.ivl || 0, Math.min(60000, now - this.shownAt), c.type]);
    if (wasNew) t.n[c.did] = (t.n[c.did] || 0) + 1;
    if (wasRev) t.r[c.did] = (t.r[c.did] || 0) + 1;
    const dirtyT = ['cards', 'revlog', 'conf'];
    // leech: a card that keeps lapsing wastes reviews — suspend it and tag the note for rewriting
    const L = S.conf.leechAt | 0;
    if (wasRev && ease === 1 && L > 0 && n.lapses >= L && (n.lapses - L) % Math.max(1, Math.ceil(L / 2)) === 0 && S.notes[c.nid]) {
      this.keepNote(u, c.nid);
      const note = S.notes[c.nid];
      if (!/(^|\s)leech(\s|$)/i.test(note.tags || '')) S.notes[c.nid] = { ...note, tags: ((note.tags || '') + ' leech').trim(), mod: now };
      n = { ...n, queue: -1 }; dirtyT.push('notes');
      toast(`Leech (${n.lapses} lapses) — suspended and tagged`);
    }
    S.cards[c.id] = n;
    // siblings (other cards of the same note) give each other away; hold them until tomorrow
    if (S.conf.burySiblings) {
      for (const x of Object.values(S.cards)) {
        if (x.nid !== c.nid || x.id === c.id || x.queue === -1 || x.bury === t.day || (x.type !== 0 && x.type !== 2)) continue;
        this.keep(u, x.id); S.cards[x.id] = { ...x, bury: t.day };
      }
    }
    this.commit(u);
    this.done++;
    markDirty(...dirtyT);
    if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) {}
    this.next();
  },
  doUndo() {
    const u = this.undo.pop(); if (!u) return;
    for (const [id, c] of Object.entries(u.cards)) { if (c) S.cards[id] = c; else delete S.cards[id]; }
    for (const [id, n] of Object.entries(u.notes)) { if (n) S.notes[id] = n; else delete S.notes[id]; }
    if (S.revlog.length > u.revlog) S.revlog.length = u.revlog;
    S.conf.today = JSON.parse(u.today);
    this.done = u.done; if (u.pool) this.pool = u.pool;
    markDirty('cards', 'notes', 'revlog', 'conf');
    const p = this.pick();
    this.q = p.q; this.card = S.cards[u.focus] || p.card; this.back = false; this.typed = ''; this.shownAt = Date.now(); this.paint();
    toast('Undone');
  },
  async more() {
    const c = this.card;
    const ch = await actionSheet(['Edit Note', 'Suspend Card', 'Bury Until Tomorrow', 'Reset Card to New', { label: 'Delete Note', destr: true }]);
    if (ch === 0) return editNoteSheet(c.nid, () => { if (S.cards[c.id]) { this.card = S.cards[c.id]; this.paint(); } else this.next(); });
    if (ch < 1) return;
    if (ch === 4 && !(await confirmDlg('Delete this note?', 'All of its cards will be removed. You can undo this until you close the session.', 'Delete', true))) return;
    const u = this.snap();
    if (ch === 4) { this.keepNote(u, c.nid); deleteNote(c.nid); toast('Note deleted'); }
    else {
      this.keep(u, c.id);
      if (ch === 1) { S.cards[c.id] = { ...c, queue: -1 }; toast('Card suspended'); }
      else if (ch === 2) { S.cards[c.id] = { ...c, bury: dayNum() }; toast('Buried until tomorrow'); }
      else { S.cards[c.id] = resetCard(c); toast('Reset to new'); }
      markDirty('cards', 'conf');
      if (this.pool && ch !== 3) this.pool = this.pool.filter(id => id !== c.id);
    }
    this.commit(u);
    this.next();
  },
  onClick(e) {
    const t = e.target.closest('[data-a]'); if (!t) return;
    const a = t.dataset.a;
    if (a === 'close') this.close();
    else if (a === 'flip' || (a === 'tapcard' && !this.back)) this.flip();
    else if (a === 'ans') this.answer(+t.dataset.e);
    else if (a === 'undo') this.doUndo();
    else if (a === 'more') this.more();
    else if (a === 'refresh') this.next();
  },
  onKey(e) {
    if (document.querySelector('.overlay,.dialog,.lightbox')) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); this.back ? this.answer(3) : this.flip(); }
    else if (this.back && /^[1-4]$/.test(e.key)) this.answer(this.mode === 'cram' ? (e.key === '1' ? 1 : 3) : +e.key);
    else if (e.key === 'Escape') this.close();
    else if ((e.metaKey || e.ctrlKey) && e.key === 'z') this.doUndo();
  },
};
function resetCard(c) { return { id: c.id, nid: c.nid, did: c.did, ord: c.ord, type: 0, queue: 0, due: 0, ivl: 0, reps: 0, lapses: 0, step: 0, pos: S.conf.nextPos++, mod: Date.now() }; }

/* ---------------- notes ---------------- */
function genOrds(model, flds) {
  if (model.type === 1) { const s = new Set(); flds.forEach(f => clozeNums(f).forEach(n => s.add(n - 1))); return [...s].sort((a, b) => a - b); }
  const ords = [];
  model.tmpls.forEach((t, i) => {
    const fmap = {}; model.flds.forEach((f, j) => (fmap[f] = flds[j] || ''));
    const ctx = { ord: i, back: false, field: n => fmap[n], fieldNonEmpty: n => stripHtml(fmap[n] || '') !== '' || /<img/i.test(fmap[n] || '') };
    const out = renderTemplate(t.q, ctx);
    const emptyCtx = { ...ctx, field: n => (n in fmap ? '' : undefined), fieldNonEmpty: () => false };
    if (stripHtml(out) !== stripHtml(renderTemplate(t.q, emptyCtx)) || /<img/i.test(out)) ords.push(i);
  });
  return ords;
}
function addNote(mid, did, flds, tags = '') {
  const model = S.models[mid], ords = genOrds(model, flds);
  if (!ords.length) return null;
  const note = { id: uid(), mid, flds, tags, guid: Math.random().toString(36).slice(2, 12), mod: Date.now() };
  S.notes[note.id] = note;
  for (const ord of ords) { const c = resetCard({ id: uid(), nid: note.id, did, ord }); S.cards[c.id] = c; }
  markDirty('notes', 'cards', 'conf');
  return note;
}
function updateNote(nid, flds, tags, did) {
  const note = S.notes[nid], model = S.models[note.mid];
  S.notes[nid] = { ...note, flds, tags, mod: Date.now() };
  const cards = Object.values(S.cards).filter(c => c.nid === nid);
  if (did) cards.forEach(c => (S.cards[c.id] = { ...c, did }));
  const have = new Set(cards.map(c => c.ord));
  const dd = did || (cards[0] && cards[0].did);
  const ords = genOrds(model, flds);
  for (const ord of ords) if (!have.has(ord) && dd) { const c = resetCard({ id: uid(), nid, did: dd, ord }); S.cards[c.id] = c; }
  // a cloze deletion that was removed from the text leaves a card with nothing to hide — drop it
  if (model.type === 1 && ords.length) for (const c of cards) if (!ords.includes(c.ord)) delete S.cards[c.id];
  markDirty('notes', 'cards', 'conf');
}
function deleteNote(nid) {
  delete S.notes[nid];
  for (const c of Object.values(S.cards)) if (c.nid === nid) delete S.cards[c.id];
  markDirty('notes', 'cards');
}
function deleteDeck(did) {
  const ids = subdeckIds(did);
  const nids = new Set();
  for (const c of Object.values(S.cards)) if (ids.has(c.did)) { nids.add(c.nid); delete S.cards[c.id]; }
  const still = new Set(Object.values(S.cards).map(c => c.nid));
  for (const n of nids) if (!still.has(n)) delete S.notes[n];
  for (const id of ids) delete S.decks[id];
  markDirty('decks', 'notes', 'cards');
}

/* ---------------- import ---------------- */
async function importFile(file, targetDid) {
  const name = file.name.replace(/\.[^.]+$/, '');
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  busy('Importing ' + file.name + '…');
  try {
    let res;
    const head = new Uint8Array(await file.slice(0, 4).arrayBuffer());
    const isZip = head[0] === 0x50 && head[1] === 0x4b;
    if (isZip || ext === 'apkg' || ext === 'colpkg' || ext === 'zip') res = await importApkg(await file.arrayBuffer());
    else res = importCsv(await file.text(), () => (targetDid && S.decks[targetDid]) || getOrCreateDeck(name));
    await persist();
    unbusy(); render();
    await confirmDlg('Import complete', res, 'OK', false, true);
  } catch (e) {
    console.error(e); unbusy();
    await confirmDlg('Import failed', e.message || String(e), 'OK', false, true);
  }
}
async function importApkg(buf) {
  const data = await parseApkg(buf, m => busyMsg(m));
  busyMsg('Adding cards…');
  const mmap = {};
  for (const m of data.models) {
    let ex = Object.values(S.models).find(x => x.ankiId === m.ankiId && x.flds.join('\x1f') === m.flds.join('\x1f'));
    if (!ex) { ex = { id: uid(), ankiId: m.ankiId, name: m.name, type: m.type, flds: m.flds, tmpls: m.tmpls, css: m.css }; S.models[ex.id] = ex; }
    else { ex.tmpls = m.tmpls; ex.css = m.css; }
    mmap[m.ankiId] = ex.id;
  }
  const dmap = {};
  const dname = {}; data.decks.forEach(d => (dname[d.ankiId] = d.name));
  const guidMap = {}; Object.values(S.notes).forEach(n => n.guid && (guidMap[n.guid] = n));
  const nmap = {}; let added = 0, dup = 0, ncards = 0;
  for (const n of data.notes) {
    if (!mmap[n.mid]) continue;
    const ex = guidMap[n.guid];
    if (ex && ex.mid === mmap[n.mid]) { S.notes[ex.id] = { ...ex, flds: n.flds, tags: n.tags }; nmap[n.ankiId] = null; dup++; continue; }
    const note = { id: uid(), mid: mmap[n.mid], flds: n.flds, tags: n.tags, guid: n.guid, mod: Date.now() };
    S.notes[note.id] = note; nmap[n.ankiId] = note.id; added++;
  }
  const now = Date.now(), nowDay = dayNum(now);
  const sorted = [...data.cards].sort((a, b) => (a.type === 0 && b.type === 0 ? a.due - b.due : 0));
  const cmap = {};
  let i = 0;
  for (const c of sorted) {
    const nid = nmap[c.nid]; if (!nid) continue;
    if (!dmap[c.did]) dmap[c.did] = getOrCreateDeck(dname[c.did] || 'Imported').id;
    const card = resetCard({ id: uid(), nid, did: dmap[c.did], ord: c.ord });
    // Anki stores its own FSRS memory state in cards.data when FSRS is enabled there
    let mem = null;
    try { const d = c.data && JSON.parse(c.data); if (d && d.s > 0 && d.d >= 1) mem = d; } catch (e) {}
    if (c.type === 2 || c.type === 3) {
      card.type = 2; card.ivl = Math.max(1, c.ivl || 1); card.ease = c.factor ? c.factor / 1000 : 2.5;
      card.reps = c.reps || 0; card.lapses = c.lapses || 0;
      const dueDay = c.type === 2 ? dayNum(data.crt * 1000) + c.due : nowDay;
      card.due = now + (dueDay - nowDay) * DAY;
    } else if (c.type === 1) { // mid-learning: keep it in learning, due straight away
      card.type = 1; card.step = 0; card.due = now; card.reps = c.reps || 0; card.lapses = c.lapses || 0;
    }
    if (mem && card.type !== 0) { card.s = mem.s; card.d = Math.min(10, mem.d); }
    if (c.queue === -1) card.queue = -1;
    S.cards[card.id] = card; cmap[c.ankiId] = card.id; ncards++;
    if (++i % 3000 === 0) { busyMsg(`Adding cards… ${i}/${sorted.length}`); await sleep(0); }
  }
  // review history (present when the deck was exported with scheduling) feeds stats and the streak
  const logs = [];
  for (const r of data.revlog || []) {
    const id = cmap[r.cid], ty = { 0: 1, 1: 2, 2: 3 }[r.type];
    if (!id || ty === undefined || !(r.ease >= 1 && r.ease <= 4)) continue;
    logs.push([r.id, id, r.ease, r.ivl || 0, r.lastIvl || 0, Math.min(60000, r.time || 0), ty]);
  }
  if (logs.length) S.revlog = S.revlog.concat(logs).sort((a, b) => a[0] - b[0]);
  // drop empty "Default" deck created by import
  for (const d of Object.values(S.decks)) if (d.name === 'Default' && !Object.values(S.cards).some(c => c.did === d.id) && !Object.values(S.decks).some(x => x.name.startsWith('Default::'))) delete S.decks[d.id];
  markDirty('models', 'notes', 'cards', 'decks', 'revlog', 'conf');
  let mcount = 0;
  for (const m of data.media) {
    try {
      const u = await m.get(); const ext = (m.name.split('.').pop() || '').toLowerCase();
      await IDB.put('media', m.name, new Blob([u], { type: MIME[ext] || 'application/octet-stream' }));
      mediaUrls.delete(m.name); mcount++;
      if (mcount % 50 === 0) { busyMsg(`Saving media… ${mcount}/${data.media.length}`); await sleep(0); }
    } catch (e) { console.warn('media', m.name, e); }
  }
  return `${added} notes, ${ncards} cards${dup ? `, ${dup} existing notes updated` : ''}${logs.length ? `, ${logs.length} past reviews` : ''}${mcount ? `, ${mcount} media files` : ''}.`;
}
/* Text import. A row is a duplicate when its first field already exists for the same
   note type (in the collection or earlier in the file) — re-importing a file adds nothing. */
function importCsv(text, getDeck) {
  const rows = parseDelimited(text);
  const key = (mid, f) => mid + '\x1f' + stripHtml(f).toLowerCase();
  const seen = new Set(Object.values(S.notes).map(n => key(n.mid, n.flds[0] || '')));
  const models = Object.values(S.models);
  let n = 0, dup = 0, bad = 0, fallback = null;
  const names = new Set();
  for (const r of rows) {
    const want = r.notetype.toLowerCase();
    const model = (want && models.find(m => m.name.toLowerCase() === want)) || S.models[1];
    const flds = model.flds.map((f, i) => r.flds[i] || '');
    const k = key(model.id, flds[0]);
    if (seen.has(k)) { dup++; continue; }
    const deck = r.deck ? getOrCreateDeck(r.deck) : fallback || (fallback = getDeck());
    if (addNote(model.id, deck.id, flds, r.tags)) { n++; seen.add(k); names.add(deck.name); } else bad++;
  }
  const where = names.size === 1 ? ` to “${[...names][0]}”` : names.size > 1 ? ` across ${names.size} decks` : '';
  return `${n} note${n === 1 ? '' : 's'} added${where}.${dup ? ` ${dup} duplicate${dup === 1 ? '' : 's'} skipped.` : ''}${bad ? ` ${bad} empty row${bad === 1 ? '' : 's'} skipped.` : ''}`;
}

    zip.file('recall.json', JSON.stringify({ recall: 2, decks: Object.values(S.decks), models: Object.values(S.models), notes: Object.values(S.notes), cards: Object.values(S.cards), revlog: S.revlog, conf: S.conf }), { compression: 'DEFLATE' });
    let n = 0;
    for (const name of await IDB.keys('media')) { const b = await IDB.get('media', name); if (b) { zip.file('media/' + name, b); n++; } }
    const blob = await zip.generateAsync({ type: 'blob' }, m => busyMsg(`Packing… ${Math.round(m.percent)}%`));
    unbusy();
    if (await saveFile('recall-backup-' + new Date().toISOString().slice(0, 10) + '.zip', blob, 'application/zip')) {
      S.conf.lastBackup = Date.now(); markDirty('conf');
      toast(`Backup saved${n ? ` with ${n} media file${n === 1 ? '' : 's'}` : ''}`);
    }
  } catch (e) { console.error(e); unbusy(); await confirmDlg('Backup failed', e.message || String(e), 'OK', false, true); }
}
/* Accepts a backup .zip, an older .json backup file, or pasted JSON text. */
async function restoreFrom(src) {
  try {
    let j, zip = null;
    if (typeof src !== 'string') {
      const head = new Uint8Array(await src.slice(0, 2).arrayBuffer());
      if (head[0] === 0x50 && head[1] === 0x4b) {
        zip = await JSZip.loadAsync(await src.arrayBuffer());
        const f = zip.file('recall.json'); if (!f) throw new Error();
        j = JSON.parse(await f.async('string'));
      } else j = JSON.parse(await src.text());
    } else j = JSON.parse(src);
    if (!j.recall || !Array.isArray(j.cards) || !Array.isArray(j.notes) || !j.conf) throw new Error();
    if (!(await confirmDlg('Replace all data?', 'Your current decks will be overwritten.', 'Replace', true))) return false;
    busy('Restoring…');
    loadTables({ decks: j.decks, models: j.models, notes: j.notes, cards: j.cards, revlog: j.revlog || [], conf: [j.conf] });
    if (zip) {
      await IDB.clear('media'); mediaUrls.clear();
      for (const f of zip.file(/^media\/./)) {
        const name = f.name.slice(6), ext = (name.split('.').pop() || '').toLowerCase();
        await IDB.put('media', name, new Blob([await f.async('uint8array')], { type: MIME[ext] || 'application/octet-stream' }));
      }
    }
    TABLES.forEach(t => dirty.add(t)); markDirty(); await persist(); unbusy(); render(); toast('Restored');
    return true;
  } catch (e) { unbusy(); toast('That doesn’t look like a Recall backup'); return false; }
}
